name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, so the pinned 1.93.0 and its rustfmt
      # component are installed automatically.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Hardware-free tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Library and invariant tests
        run: cargo test --lib
      - name: Invariant suites
        run: cargo test --test provider_invariants --test session_invariants --test classification_invariants --test fixture_oracle
      # Fixture completeness/shape checks that do not need the running service.
      # The value replay itself starts the binary and needs the vendor
      # middleware, so it is a local/pre-release check (see docs/CI.md).
      - name: Fixture structural checks
        run: cargo test --test contract_fixtures fixture_count_is_at_least_37 && cargo test --test contract_fixtures every_expected_method_has_a_fixture
      - name: Integration suites that do not need the vendor library
        run: cargo test --test session_isolation --test session_lifecycle --test transport_limits --test ffi_serialization --test loopback_gate --test protocol_version --test restricted_methods --test log_redaction
      # Phase 7-9 security suites. Certificates are generated in-process with
      # `rcgen` and tokens come from the test process, so these need no USB token
      # and no vendor middleware.
      - name: TLS and client-authentication suites (hermetic, no token)
        run: cargo test --test tls --test client_auth --test audit

  # NOTE: the frozen v0.2.0 contract replay (`cargo test --test contract_fixtures`)
  # is intentionally NOT a hosted job. It needs the GM3000 macOS *middleware*
  # installed, not just the committed dylib: a hosted macOS runner loads the dylib
  # but every ConnectDev returns 0x00000001 instead of the recorded 0x0A000023.
  # Run it locally or on a self-hosted x86_64 macOS runner before a release. The
  # structural fixture checks and the fixture oracle still run here.

  windows-i686:
    name: Windows i686 compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Add i686 target
        run: rustup target add i686-pc-windows-gnu
      - name: cargo check --target i686-pc-windows-gnu
        run: cargo check --target i686-pc-windows-gnu

  gate-selftest:
    name: Gate self-test (a failing test must be caught)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the test gate is failure-sensitive: a deliberately failing test must
      # make the gate command exit non-zero. The job itself passes because it
      # asserts that failure.
      - name: Prove the test gate fails on a failing test
        run: |
          printf '#[test]\nfn deliberate_failure() { assert!(false); }\n' > tests/ci_selftest.rs
          if cargo test --test ci_selftest; then
            echo "::error::the test gate did not fail on a deliberately failing test"
            rm -f tests/ci_selftest.rs
            exit 1
          fi
          rm -f tests/ci_selftest.rs
          echo "gate is failure-sensitive"
