[package]
name = "skf-service"
version = "0.3.1"
edition = "2021"

[features]
default = []
# Compiles the in-memory provider used by tests. Kept out of release builds.
test-provider = []

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
libloading = "0.8"
log = "0.4"
env_logger = "0.11"
base64 = "0.22.1"
anyhow = "1.0.100"
futures-util = "0.3.31"
x509-parser = "0.15"
warp = "0.3"
smcrypto = "0.3"
rand = "0.8"

# Windows Service (SCM) integration. Only built on Windows targets.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# Used to redirect stdout/stderr to a log file when running as a service.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
# Integration tests live in their own crates, so `cfg(test)` does not reach them.
# Depending on ourselves with the feature enabled is the supported way to give
# tests access to the fake provider without shipping it.
skf-service = { path = ".", features = ["test-provider"] }
